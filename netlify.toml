[build]
  command = "npm run build"
  publish = "dist/iso-8583-tools/browser"

[build.environment]
  NODE_VERSION = "22"

# Aplicação de página única: qualquer rota desconhecida cai no index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
